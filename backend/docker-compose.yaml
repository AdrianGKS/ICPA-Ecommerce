version: '3.8'

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASS}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # Novo serviço: O "Configurador" Automático
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio_init
    depends_on:
      - minio
    environment:
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASS=${MINIO_PASS}
    entrypoint: >
      /bin/sh -c "
      echo 'Aguardando o MinIO iniciar...';
      sleep 5;
      /usr/bin/mc alias set meuminio http://minio:9000 $${MINIO_USER} $${MINIO_PASS};
      /usr/bin/mc mb meuminio/icpa-ecommerce-bucket --ignore-existing;
      /usr/bin/mc anonymous set download meuminio/icpa-ecommerce-bucket;
      echo 'Bucket configurado com sucesso e sem erros!';
      exit 0;
      "

# Esta é a declaração obrigatória que estava faltando!
volumes:
  minio_data: